name: Continuous verification

on:
  push:
    branches:
      - main
      - 'codex/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify Go, web, and Python
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify web
        run: |
          npm --prefix web ci
          npm --prefix web run verify

      - name: Verify Go
        run: |
          go vet ./...
          go test ./...
          go build ./...

      - name: Verify Python worker protocols
        run: python -m unittest discover -s cmd -p '*_test.py'
