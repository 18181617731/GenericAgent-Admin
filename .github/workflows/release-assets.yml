name: Build and upload release assets

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and upload assets for; use semantic version tags such as v0.1.1 or explicit prerelease/fix tags
        required: true
        default: v0.1.1
      confirm_overwrite_assets:
        description: Type true only after approving that existing assets for this tag may be overwritten
        required: true
        default: 'false'
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  prepare-release:
    name: Prepare Release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Release boundary preflight
        id: meta
        shell: bash
        run: |
          tag='${{ inputs.tag || github.ref_name }}'
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::This release workflow must run with a semantic version tag such as v0.1.1, v0.1.1-fix1, or v0.1.1-rc1; got '$tag'."
            exit 1
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.confirm_overwrite_assets }}" != "true" ]; then
            echo "::error::Manual dispatch requires confirm_overwrite_assets=true because upload uses --clobber."
            exit 1
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "::notice::Release boundary accepted for ${tag}; asset upload uses --clobber."

      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      # Single point of release creation. All build jobs only upload assets,
      # otherwise the parallel matrix races and GitHub returns
      # "Validation Failed: Release already_exists" plus duplicate drafts.
      - name: Create release if absent
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag='${{ steps.meta.outputs.tag }}'
          prerelease_flag=''
          case "$tag" in
            *-alpha*|*-beta*|*-rc*|*-preview*) prerelease_flag='--prerelease' ;;
          esac
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; ensuring flags are correct."
            if [ -n "$prerelease_flag" ]; then
              gh release edit "$tag" --draft=false --prerelease
            else
              gh release edit "$tag" --draft=false --latest
            fi
          else
            gh release create "$tag" --title "$tag" --notes "Assets are being uploaded..." $prerelease_flag
          fi

  build:
    name: ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    needs: prepare-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
            runner: windows-latest
            cgo: '1'
          - goos: windows
            goarch: arm64
            runner: windows-latest
            cgo: '1'
          - goos: darwin
            goarch: amd64
            runner: macos-latest
            cgo: '1'
          - goos: darwin
            goarch: arm64
            runner: macos-latest
            cgo: '1'
          - goos: linux
            goarch: amd64
            runner: ubuntu-latest
            cgo: '0'
          - goos: linux
            goarch: arm64
            runner: ubuntu-latest
            cgo: '0'

    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Verify and build web
        shell: bash
        run: |
          cd web
          npm ci || npm install
          npm run verify

      - name: Build binary
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: ${{ matrix.cgo }}
        run: |
          mkdir -p dist/cmd
          cp cmd/chat_worker.py dist/cmd/chat_worker.py
          tag='${{ inputs.tag || github.ref_name }}'
          COMMIT=$(git rev-parse --short HEAD)
          BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          LDFLAGS="-s -w -X genericagent-admin-go/internal/version.Version=${tag} -X genericagent-admin-go/internal/version.Commit=${COMMIT} -X genericagent-admin-go/internal/version.Date=${BUILD_DATE}"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            go build -ldflags="$LDFLAGS -H=windowsgui" -o dist/ga-admin.exe .
          else
            go build -ldflags="$LDFLAGS" -o dist/ga-admin .
          fi

      - name: Package
        shell: bash
        run: |
          tag='${{ inputs.tag || github.ref_name }}'
          version="${tag#v}"
          name="ga-admin-${tag}-${{ matrix.goos }}-${{ matrix.goarch }}"
          mkdir -p package "$name"
          cp -R dist/* "$name"/
          cat > "$name/README.txt" <<EOF
          GenericAgent Admin Go ${tag}

          Run ga-admin.exe on Windows, or ga-admin on macOS/Linux.
          Linux servers without DISPLAY/Wayland enter headless mode automatically; use --headless or GA_ADMIN_HEADLESS=1 to force it.
          The executable embeds the React/Vite web UI.
          GenericAgent services still require your local GenericAgent Python environment.
          EOF
          if [ "${{ matrix.goos }}" = "windows" ]; then
            powershell -NoProfile -Command "Compress-Archive -Path '$name' -DestinationPath 'package/$name.zip' -Force"
          else
            zip -r "package/$name.zip" "$name"
          fi
          cd package
          python -c "import hashlib, pathlib; [p.with_suffix(p.suffix + '.sha256').write_text(hashlib.sha256(p.read_bytes()).hexdigest() + '  ' + p.name + '\\n', encoding='utf-8') for p in pathlib.Path('.').glob('*.zip')]"

      - name: Upload build artifact for portable build
        uses: actions/upload-artifact@v4
        with:
          name: ga-admin-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/
          retention-days: 1

      - name: Upload to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag='${{ inputs.tag || github.ref_name }}'
          gh release upload "$tag" package/*.zip package/*.sha256 --clobber --repo '${{ github.repository }}'

  build-portable:
    name: Build portable bundle (${{ matrix.goos }}-${{ matrix.goarch }})
    runs-on: ${{ matrix.runner }}
    needs: build
    strategy:
      matrix:
        include:
          - goos: windows
            goarch: amd64
            runner: windows-latest
          # arm64 bundles must build on native arm64 runners: uv installs a
          # standalone interpreter for the HOST arch, and the venv/pip step
          # executes it. Cross-arch hosts would ship an x86_64 interpreter
          # inside an arm64 bundle (and fail to run it at all).
          - goos: windows
            goarch: arm64
            runner: windows-11-arm
          - goos: darwin
            goarch: amd64
            runner: macos-13
          - goos: darwin
            goarch: arm64
            runner: macos-latest
          - goos: linux
            goarch: amd64
            runner: ubuntu-latest
          - goos: linux
            goarch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0  # Need full history for git describe

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: pip install uv

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ga-admin-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/

      - name: Build portable bundle
        shell: bash
        run: |
          python scripts/portable/build_portable.py \
            --platform ${{ matrix.goos }} \
            --arch ${{ matrix.goarch }} \
            --out-dir portable-out \
            --skip-build

      - name: Package bundle (Windows)
        if: matrix.goos == 'windows'
        shell: powershell
        run: |
          $bundleDir = Get-ChildItem -Path portable-out -Directory | Select-Object -First 1
          if (-not $bundleDir) { throw "No bundle found" }
          $zipName = "$($bundleDir.Name).zip"
          Compress-Archive -Path $bundleDir.FullName -DestinationPath $zipName -Force
          $hash = (Get-FileHash $zipName -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path "${zipName}.sha256" -Value "$hash  $zipName" -NoNewline

      - name: Package bundle (Unix)
        if: matrix.goos != 'windows'
        run: |
          cd portable-out
          bundleDir=$(ls -d */ | head -n1 | sed 's#/##')
          if [ -z "$bundleDir" ]; then echo "No bundle found"; exit 1; fi
          tarName="${bundleDir}.tar.gz"
          tar -czf "../${tarName}" "$bundleDir"
          cd ..
          sha256sum "${tarName}" | awk '{print $1 "  " $2}' > "${tarName}.sha256"

      - name: Upload to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag='${{ inputs.tag || github.ref_name }}'
          shopt -s nullglob
          files=(ga-admin-portable-*.zip ga-admin-portable-*.tar.gz ga-admin-portable-*.sha256)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No portable bundle artifacts found"
            exit 1
          fi
          gh release upload "$tag" "${files[@]}" --clobber --repo '${{ github.repository }}'

  finalize-release:
    name: Finalize Release
    runs-on: ubuntu-latest
    needs: [build, build-portable]
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0

      - name: Generate release body
        run: |
          tag='${{ inputs.tag || github.ref_name }}'
          repo='${{ github.repository }}'
          
          # Generate download table
          cat > release-body.md <<'EOF'
          ## 📥 Downloads

          | Platform | Architecture | Binary | Portable Bundle |
          |----------|--------------|--------|-----------------|
          EOF
          
          # Windows
          echo "| **Windows** | x86-64 | [ga-admin-windows-amd64.exe](https://github.com/${repo}/releases/download/${tag}/ga-admin-${tag}-windows-amd64.zip) | [ga-admin-portable-windows-amd64-${tag}.zip](https://github.com/${repo}/releases/download/${tag}/ga-admin-portable-windows-amd64-${tag}.zip) |" >> release-body.md
          echo "| | ARM64 | [ga-admin-windows-arm64.exe](https://github.com/${repo}/releases/download/${tag}/ga-admin-${tag}-windows-arm64.zip) | [ga-admin-portable-windows-arm64-${tag}.zip](https://github.com/${repo}/releases/download/${tag}/ga-admin-portable-windows-arm64-${tag}.zip) |" >> release-body.md
          
          # Linux
          echo "| **Linux** | x86-64 | [ga-admin-linux-amd64](https://github.com/${repo}/releases/download/${tag}/ga-admin-${tag}-linux-amd64.zip) | [ga-admin-portable-linux-amd64-${tag}.tar.gz](https://github.com/${repo}/releases/download/${tag}/ga-admin-portable-linux-amd64-${tag}.tar.gz) |" >> release-body.md
          echo "| | ARM64 | [ga-admin-linux-arm64](https://github.com/${repo}/releases/download/${tag}/ga-admin-${tag}-linux-arm64.zip) | [ga-admin-portable-linux-arm64-${tag}.tar.gz](https://github.com/${repo}/releases/download/${tag}/ga-admin-portable-linux-arm64-${tag}.tar.gz) |" >> release-body.md
          
          # macOS
          echo "| **macOS** | x86-64 (Intel) | [ga-admin-darwin-amd64](https://github.com/${repo}/releases/download/${tag}/ga-admin-${tag}-darwin-amd64.zip) | [ga-admin-portable-darwin-amd64-${tag}.tar.gz](https://github.com/${repo}/releases/download/${tag}/ga-admin-portable-darwin-amd64-${tag}.tar.gz) |" >> release-body.md
          echo "| | ARM64 (Apple Silicon) | [ga-admin-darwin-arm64](https://github.com/${repo}/releases/download/${tag}/ga-admin-${tag}-darwin-arm64.zip) | [ga-admin-portable-darwin-arm64-${tag}.tar.gz](https://github.com/${repo}/releases/download/${tag}/ga-admin-portable-darwin-arm64-${tag}.tar.gz) |" >> release-body.md
          
          # Add description
          cat >> release-body.md <<'EOF'

          **Binary**: Single executable file, requires Python 3.8+ and GenericAgent source code on your system.  
          **Portable Bundle**: Complete standalone package with GA source code + Python 3.12.7 + venv, ready to run after extraction.

          ---

          ## 📝 Changelog

          EOF
          
          # Extract changelog from commits since last tag
          last_tag=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$last_tag" ]; then
            echo "**Changes since ${last_tag}:**" >> release-body.md
            echo "" >> release-body.md
            git log ${last_tag}..HEAD --pretty=format:"- %s (%h)" --no-merges >> release-body.md
          else
            echo "Initial release." >> release-body.md
          fi
          
          cat release-body.md

      - name: Update release body
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          body_path: release-body.md
          prerelease: ${{ contains(inputs.tag || github.ref_name, '-alpha') || contains(inputs.tag || github.ref_name, '-beta') || contains(inputs.tag || github.ref_name, '-rc') || contains(inputs.tag || github.ref_name, '-preview') }}
          overwrite_files: false
